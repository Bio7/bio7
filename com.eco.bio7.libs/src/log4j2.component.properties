# Bio7: no logging of the libraries which use the Log4j API (e.g., Apache POI).
# The simple logging provider of the Log4j API (no Log4j Core in Bio7) switched
# off: else the Log4j API reports "could not find a logging provider".
log4j.provider=org.apache.logging.log4j.simple.internal.SimpleProvider
org.apache.logging.log4j.simplelog.level=OFF
